<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Summarizer</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
            radial-gradient(circle at bottom right, #ede9fe 0%, transparent 35%),
            linear-gradient(135deg, #f8fafc, #eef2ff);

        color: #1e293b;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px 20px;
    }

    /* Main Container */

    .container {
        width: 100%;
        max-width: 850px;

        background: rgba(255, 255, 255, 0.85);

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        border: 1px solid rgba(255, 255, 255, 0.6);

        border-radius: 24px;

        padding: 40px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.12);

        animation: fadeIn 0.6s ease;
    }

    /* Header */

    .header {
        text-align: center;
        margin-bottom: 35px;
    }

    .logo {
        width: 65px;
        height: 65px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 18px;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: white;

        font-size: 30px;

        box-shadow:
            0 10px 25px rgba(99, 102, 241, 0.3);
    }

    h1 {
        font-size: 32px;
        font-weight: 700;

        margin-bottom: 8px;

        color: #0f172a;
    }

    .subtitle {
        color: #64748b;
        font-size: 16px;
    }

    .technology {
        display: inline-block;

        margin-top: 12px;

        padding: 6px 14px;

        border-radius: 20px;

        background: #eef2ff;

        color: #4f46e5;

        font-size: 13px;

        font-weight: 600;
    }

    /* Input Section */

    .input-section {
        margin-bottom: 25px;
    }

    .section-header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 10px;
    }

    .section-title {
        font-size: 15px;

        font-weight: 600;

        color: #334155;
    }

    #char-count {
        font-size: 13px;

        color: #94a3b8;
    }

    textarea {
        width: 100%;

        min-height: 220px;

        resize: vertical;

        padding: 18px;

        border: 1px solid #cbd5e1;

        border-radius: 14px;

        background: #ffffff;

        color: #1e293b;

        font-size: 15px;

        line-height: 1.6;

        outline: none;

        transition: all 0.25s ease;
    }

    textarea::placeholder {
        color: #94a3b8;
    }

    textarea:focus {
        border-color: #6366f1;

        box-shadow:
            0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    /* Buttons */

    .button-group {
        display: flex;

        gap: 12px;

        margin-top: 15px;
    }

    button {
        border: none;

        border-radius: 12px;

        padding: 13px 22px;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: all 0.25s ease;
    }

    .summarize-btn {
        flex: 1;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: white;

        box-shadow:
            0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .summarize-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 12px 25px rgba(99, 102, 241, 0.35);
    }

    .summarize-btn:disabled {
        cursor: not-allowed;

        opacity: 0.7;

        transform: none;
    }

    .clear-btn {
        background: #f1f5f9;

        color: #475569;
    }

    .clear-btn:hover {
        background: #e2e8f0;
    }

    /* Summary Output */

    #summary-output {
        margin-top: 30px;

        padding: 25px;

        background: linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );

        border: 1px solid #e2e8f0;

        border-radius: 16px;

        display: none;

        animation: slideUp 0.4s ease;
    }

    .summary-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 15px;
    }

    .summary-title {
        display: flex;

        align-items: center;

        gap: 10px;

        font-size: 18px;

        font-weight: 700;

        color: #1e293b;
    }

    .summary-icon {
        width: 35px;

        height: 35px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 10px;

        background: #e0e7ff;

        color: #4f46e5;
    }

    .copy-btn {
        padding: 8px 14px;

        font-size: 13px;

        background: white;

        color: #4f46e5;

        border: 1px solid #c7d2fe;
    }

    .copy-btn:hover {
        background: #eef2ff;
    }

    #summary-text {
        color: #475569;

        font-size: 15px;

        line-height: 1.8;

        white-space: pre-wrap;
    }

    /* Loading Animation */

    .loading {
        display: inline-flex;

        align-items: center;

        gap: 8px;
    }

    .dots span {
        display: inline-block;

        width: 6px;

        height: 6px;

        background: #6366f1;

        border-radius: 50%;

        animation: bounce 1.4s infinite ease-in-out both;
    }

    .dots span:nth-child(1) {
        animation-delay: -0.32s;
    }

    .dots span:nth-child(2) {
        animation-delay: -0.16s;
    }

    /* Footer */

    .footer {
        text-align: center;

        margin-top: 25px;

        font-size: 12px;

        color: #94a3b8;
    }

    /* Animations */

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes bounce {
        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }

    /* Responsive */

    @media (max-width: 600px) {

        body {
            padding: 20px 12px;
        }

        .container {
            padding: 25px 20px;

            border-radius: 18px;
        }

        h1 {
            font-size: 26px;
        }

        .button-group {
            flex-direction: column;
        }

        .summarize-btn,
        .clear-btn {
            width: 100%;
        }

        .summary-header {
            align-items: flex-start;

            gap: 15px;

            flex-direction: column;
        }
    }
</style>


</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="logo">
            ✨
        </div>

        <h1>Text Summarizer</h1>

        <p class="subtitle">
            Transform long text into concise, meaningful summaries
        </p>

        <span class="technology">
            Powered by Hugging Face Transformers
        </span>

    </div>


    <!-- Input Section -->

    <div class="input-section">

        <div class="section-header">

            <span class="section-title">
                Enter your content
            </span>

            <span id="char-count">
                0 characters
            </span>

        </div>


        <textarea
            id="dialogue-input"
            placeholder="Paste or type your content here..."
            required
        ></textarea>


        <div class="button-group">

            <button
                type="button"
                class="clear-btn"
                id="clear-btn"
            >
                Clear
            </button>

            <button
                type="button"
                class="summarize-btn"
                id="summarize-btn"
            >
                Summarize Text
            </button>

        </div>

    </div>


    <!-- Summary Output -->

    <div id="summary-output">

        <div class="summary-header">

            <div class="summary-title">

                <div class="summary-icon">
                    ✨
                </div>

                <span>
                    Generated Summary
                </span>

            </div>

            <button
                class="copy-btn"
                id="copy-btn"
            >
                Copy Summary
            </button>

        </div>


        <p id="summary-text"></p>

    </div>


    <div class="footer">
        AI-powered text summarization using Transformer-based NLP
    </div>

</div>


<script>

    const dialogueInput =
        document.getElementById("dialogue-input");

    const summaryText =
        document.getElementById("summary-text");

    const summaryOutput =
        document.getElementById("summary-output");

    const summarizeButton =
        document.getElementById("summarize-btn");

    const clearButton =
        document.getElementById("clear-btn");

    const copyButton =
        document.getElementById("copy-btn");

    const charCount =
        document.getElementById("char-count");


    /* Character Counter */

    dialogueInput.addEventListener(
        "input",
        () => {

            const count =
                dialogueInput.value.length;

            charCount.innerText =
                `${count} characters`;

        }
    );


    /* Summarize */

    summarizeButton.addEventListener(
        "click",
        async () => {

            const dialogue =
                dialogueInput.value.trim();


            if (!dialogue) {

                summaryOutput.style.display =
                    "block";

                summaryText.innerText =
                    "Please enter some text to summarize.";

                return;

            }


            /* Loading State */

            summarizeButton.disabled =
                true;

            summarizeButton.innerHTML = `
                <span class="loading">
                    Summarizing
                    <span class="dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </span>
            `;


            summaryOutput.style.display =
                "block";

            summaryText.innerText =
                "Processing your content...";


            try {

                const response =
                    await fetch(
                        "/summarize/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    dialogue:
                                        dialogue
                                })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `Server error: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                summaryText.innerText =
                    data.summary ||
                    "No summary returned.";


            } catch (error) {

                summaryText.innerText =
                    `Something went wrong: ${error.message}`;

            } finally {

                summarizeButton.disabled =
                    false;

                summarizeButton.innerHTML =
                    "Summarize Text";

            }

        }
    );


    /* Clear Button */

    clearButton.addEventListener(
        "click",
        () => {

            dialogueInput.value = "";

            summaryText.innerText = "";

            summaryOutput.style.display =
                "none";

            charCount.innerText =
                "0 characters";

        }
    );


    /* Copy Summary */

    copyButton.addEventListener(
        "click",
        async () => {

            const text =
                summaryText.innerText;


            if (!text) return;


            try {

                await navigator.clipboard
                    .writeText(text);


                copyButton.innerText =
                    "Copied!";


                setTimeout(
                    () => {

                        copyButton.innerText =
                            "Copy Summary";

                    },
                    1500
                );


            } catch (error) {

                alert(
                    "Unable to copy summary."
                );

            }

        }
    );

</script>

</body>
</html>
